name: Build Android APK
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Signing key (created once, then reused so app updates install over old ones)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release download keys -p easydeals.keystore -O android/easydeals.keystore; then
            echo reuse existing key
          else
            keytool -genkeypair -keystore android/easydeals.keystore -alias easydeals -keyalg RSA -keysize 2048 -validity 12000 -storepass easydeals123 -keypass easydeals123 -dname "CN=EasyDeals CRM, O=EasyDeals, C=IN"
            gh release create keys android/easydeals.keystore --title keys --notes "signing key"
          fi
      - name: Build APK
        working-directory: android
        env:
          RUN_NO: ${{ github.run_number }}
        run: gradle assembleDebug --no-daemon --stacktrace
      - name: Publish APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk EasyDeals-CRM.apk
          gh release delete latest-apk --yes --cleanup-tag || true
          gh release create latest-apk EasyDeals-CRM.apk --title "EasyDeals CRM Android app" --notes "Build ${{ github.run_number }}"
