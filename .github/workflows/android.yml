name: Build Android APK
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Signing key (from repo secrets only; build stops if they are missing)
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KSP: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          # No fallback key: an APK signed with a different or public key would not update on staff phones
          # and could be impersonated. Missing secrets = fail the build.
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KSP" ]; then
            echo "::error::KEYSTORE_B64 and KEYSTORE_PASSWORD repo secrets are required. Build stopped, nothing published."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > android/easydeals.keystore
          P=$(printf %s "$KSP" | tr -d '[:space:]')
          echo "::add-mask::$P"
          echo "KEYSTORE_PASSWORD=$P" >> "$GITHUB_ENV"
          keytool -list -keystore android/easydeals.keystore -storepass "$P" >/dev/null || { echo "::error::Keystore or password is wrong. Build stopped."; exit 1; }
      - name: Build APK
        working-directory: android
        env:
          RUN_NO: ${{ github.run_number }}
        run: gradle assembleDebug --no-daemon --stacktrace
      - name: Publish APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk EasyDeals-CRM.apk
          gh release delete latest-apk --yes --cleanup-tag || true
          gh release create latest-apk EasyDeals-CRM.apk --title "EasyDeals CRM Android app" --notes "Build ${{ github.run_number }}"
