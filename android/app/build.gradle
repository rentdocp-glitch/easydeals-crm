plugins {
    id 'com.android.application' version '8.5.2'
}

android {
    namespace 'com.easydeals.crm'
    compileSdk 34

    defaultConfig {
        applicationId 'com.easydeals.crm'
        minSdk 24
        targetSdk 34
        versionCode Integer.parseInt(System.getenv('RUN_NO') ?: '1')
        versionName '1.0'
    }
    signingConfigs {
        shared {
            storeFile file('../easydeals.keystore')
            // Real password comes from the KEYSTORE_PASSWORD secret; old default only for the legacy key
            storePassword System.getenv('KEYSTORE_PASSWORD') ?: 'easydeals123'
            keyAlias 'easydeals'
            keyPassword System.getenv('KEYSTORE_PASSWORD') ?: 'easydeals123'
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.shared
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
