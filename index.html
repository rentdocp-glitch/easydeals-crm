<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f4e78">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>EasyDeals CRM</title>
<style>
:root{--bg:#f4f6f9;--card:#fff;--tx:#1b1f24;--mu:#6b7280;--bd:#e2e5ea;--pr:#1f4e78;--ok:#15803d;--wr:#b45309;--er:#b91c1c}
*{box-sizing:border-box}
body{margin:0;font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--tx);padding-bottom:70px}
header{position:sticky;top:0;z-index:5;display:flex;gap:8px;align-items:center;justify-content:space-between;padding:10px 14px;background:var(--pr);color:#fff}
header b{font-size:16px}#who{font-size:12px;opacity:.9}
header button{background:rgba(255,255,255,.18);color:#fff;border:0;border-radius:8px;padding:6px 10px;font-size:13px}
main{max-width:900px;margin:auto;padding:12px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0)}
nav button{flex:1;border:0;background:none;padding:10px 2px;font-size:12px;color:var(--mu)}
nav button.on{color:var(--pr);font-weight:700;border-top:3px solid var(--pr)}
input,select,textarea,button,.btn{font:inherit}
input,select,textarea{width:100%;padding:9px 10px;border:1px solid var(--bd);border-radius:8px;background:#fff;color:var(--tx)}
button,.btn{display:inline-block;cursor:pointer;border:1px solid var(--bd);background:#fff;color:var(--tx);border-radius:8px;padding:8px 12px;text-decoration:none;text-align:center}
.p{background:var(--pr);border-color:var(--pr);color:#fff}.g{background:var(--ok);border-color:var(--ok);color:#fff}.r{color:var(--er)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:10px}
.alert{border-color:var(--ok);background:#ecfdf3;cursor:pointer}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-start;justify-content:space-between}
.mu{color:var(--mu);font-size:12.5px}.er{color:var(--er)}.ok{color:var(--ok)}.wr{color:var(--wr)}
.tag{display:inline-block;padding:2px 9px;border-radius:99px;font-size:11.5px;border:1px solid var(--bd);white-space:nowrap}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:10px}
.stat b{display:block;font-size:22px}
.form{margin-top:10px;padding-top:10px;border-top:1px dashed var(--bd);display:grid;gap:8px}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.chips{display:flex;gap:6px;margin-bottom:10px}.chips button.on{background:var(--pr);color:#fff;border-color:var(--pr)}
.login{max-width:340px;margin:12vh auto;display:grid;gap:10px;text-align:center}
#toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:10px;display:none;z-index:9;max-width:90%}
#toast.err{background:var(--er)}
#tmr{font-weight:700}
a{color:var(--pr)}
.wa{display:inline-block;margin-left:10px;padding:3px 11px;border-radius:99px;background:#25d366;color:#fff;font-size:13px;text-decoration:none;vertical-align:middle}
.lr{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--bd);font-size:14px}
.lr:last-child{border-bottom:0}
.sm{padding:4px 10px;font-size:13px}
.chp{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.note{margin-top:6px;padding:6px 8px;background:#fffbea;border:1px solid #f1e3a6;border-radius:8px;font-size:13.5px;white-space:pre-wrap}
label{font-size:12.5px;color:var(--mu)}
textarea{resize:vertical}
</style></head><body>
<header id="hdr" style="display:none"><div><b>🏠 EasyDeals CRM</b><br><span id="who"></span></div><div><button id="inst" style="display:none" onclick="doInstall()">📲 Install</button> <button onclick="render()">⟳</button> <button onclick="logout()">Logout</button></div></header>
<main id="app"></main>
<nav id="nav" style="display:none"></nav>
<div id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SB_URL='https://sfvpslsexobukgerkixi.supabase.co';
const SB_KEY='sb_publishable_YckWE6w7_PM9Q8ysBM-XFg_KBQwYDEa';
const sb=supabase.createClient(SB_URL,SB_KEY);
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=s=>{s=Math.round(+s||0);const m=Math.floor(s/60),r=s%60;return m?m+' min '+r+' sec':r+' sec'};
const dshort=x=>new Date(x).toLocaleDateString('en-IN',{day:'2-digit',month:'short'});
const dtime=x=>new Date(x).toLocaleString('en-IN',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'});
const ST={new:'New',callback:'Call Back',ringing:'Ringing',followup:'Follow Up',meeting_assigned:'Meeting Assigned',meeting_done:'Meeting Done',online_meet_done:'Online Meet Done',not_interested:'Not Interested',deal_closed:'Deal Closed'};
const TCS=['meeting_assigned','followup','callback','ringing','meeting_done','deal_closed','not_interested'];
const FES=['meeting_done','followup','not_interested','deal_closed','callback','ringing','online_meet_done'];
const ALLS=Object.keys(ST).filter(k=>k!='new');
const myStatuses=()=>ME.role=='fe'?FES:ME.role=='telecaller'?TCS:ALLS;
const ROLE={admin:'Admin',telecaller:'Telecaller',fe:'Field Exec'};
const tag=s=>`<span class="tag ${s=='deal_closed'?'ok':s=='not_interested'?'er':'wr'}">${ST[s]||esc(s)}</span>`;
let ME=null,P={},tab='',openId=null,openK=null,noteId=null,q='',RANGE='today',showAdd=false,LEADS={},poll=null,t0=null,tint=null,instEv=null,fLoc='',fBhk='',fSt='',FILT={loc:[],bhk:[],t:0};

function toast(m,err){const t=$('#toast');t.textContent=m;t.className=err?'err':'';t.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display='none',3200)}
const clean=s=>String(s||'').replace(/[,()%*]/g,' ').trim();
const ph10=s=>String(s||'').replace(/\D/g,'').slice(-10);

/* ---------- login ---------- */
function showLogin(msg){
  $('#hdr').style.display='none';$('#nav').style.display='none';
  $('#app').innerHTML=`<div class="login"><h1>🏠 EasyDeals CRM</h1>
  <input id="em" type="email" placeholder="Email" autocomplete="username">
  <input id="pw" type="password" placeholder="Password" autocomplete="current-password" onkeydown="if(event.key=='Enter')login()">
  <button class="p" onclick="login()">Login</button><div class="er" id="lerr">${esc(msg||'')}</div></div>`;
}
async function login(){
  const {data,error}=await sb.auth.signInWithPassword({email:$('#em').value.trim(),password:$('#pw').value});
  if(error){$('#lerr').textContent='Wrong email or password.';return}
  boot(data.user);
}
async function logout(){await sb.auth.signOut();ME=null;clearInterval(poll);showLogin()}
async function boot(user){
  const {data:me,error}=await sb.from('profiles').select('*').eq('id',user.id).single();
  if(error||!me){showLogin('Profile not found. Please contact the admin.');return}
  ME=me;
  const {data:all}=await sb.from('profiles').select('*');P={};(all||[]).forEach(p=>P[p.id]=p);
  $('#hdr').style.display='flex';$('#nav').style.display='flex';
  tab='';openId=null;openK=null;q='';
  render();
  clearInterval(poll);
  poll=setInterval(()=>{if(!ME||document.hidden||openId||noteId||showAdd)return;const a=document.activeElement;if(a&&/INPUT|SELECT|TEXTAREA/.test(a.tagName))return;render()},45000);
}

/* ---------- shell ---------- */
const TABS={
  admin:[['dash','📊 Dashboard'],['calls','📞 Call Log'],['leads','🗂 Data'],['team','👥 Team']],
  telecaller:[['call','📞 Calling'],['meet','📅 Meetings'],['deal','✅ Deals']],
  fe:[['asg','📅 Meetings'],['fu','🔁 Follow Up'],['done','☑️ Done'],['deal','✅ Deals'],['ni','❌ Not Int.']]};
function go(t){tab=t;q='';openId=null;openK=null;noteId=null;showAdd=false;render()}
async function render(){
  if(!ME)return;
  const list=TABS[ME.role]||TABS.telecaller;
  if(!list.find(t=>t[0]==tab))tab=list[0][0];
  $('#nav').innerHTML=list.map(t=>`<button class="${t[0]==tab?'on':''}" onclick="go('${t[0]}')">${t[1]}</button>`).join('');
  $('#who').textContent=(ME.name||'')+' · '+(ROLE[ME.role]||ME.role);
  let h;
  try{h=await VIEW[ME.role+':'+tab]()}catch(e){h=`<div class="card er">Error: ${esc(e.message||e)}</div>`}
  let nb='';
  if(ME.role=='telecaller'&&tab!='deal'){try{nb=await dealBanner()}catch(e){}}
  $('#app').innerHTML=nb+h;
}
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();instEv=e;$('#inst').style.display='inline-block'});
async function doInstall(){if(!instEv)return;instEv.prompt();await instEv.userChoice;instEv=null;$('#inst').style.display='none'}

/* ---------- helpers ---------- */
async function pageAll(build){let out=[],f=0;for(;;){const {data,error}=await build().range(f,f+999);if(error)throw error;out=out.concat(data);if(data.length<1000||f>20000)break;f+=1000}return out}
async function histMap(ids){
  if(!ids.length)return {};
  const {data}=await sb.from('calls').select('lead_id,by_id,duration_sec,outcome,created_at').in('lead_id',ids).order('created_at',{ascending:false});
  const m={};(data||[]).forEach(c=>(m[c.lead_id]=m[c.lead_id]||[]).push(c));return m;
}
const hist=cs=>cs&&cs.length?'<div class="mu">Call history: '+cs.slice(0,5).map(c=>esc(P[c.by_id]?.name||'?')+' – '+fmt(c.duration_sec)+' ('+dshort(c.created_at)+')').join(' • ')+(cs.length>5?' • +'+(cs.length-5)+' more':'')+'</div>':'<div class="mu">No calls on this lead yet</div>';
const fp=l=>{if(l.price_l!=null&&l.price_l!==''){const v=+l.price_l;return v>=100?(+(v/100).toFixed(2))+' Cr':(+v.toFixed(2))+' L'}return l.price||''};
function parsePrice(s){
  const m=String(s||'').replace(/,/g,'').match(/([\d.]+)\s*(cr|crore|crores|l|lac|lacs|lakh|lakhs)?\b/i);
  if(!m)return null;const v=parseFloat(m[1]);if(!isFinite(v))return null;
  const u=(m[2]||'').toLowerCase();
  if(u.startsWith('c'))return Math.round(v*100*100)/100;
  if(u)return v;
  return v>=100000?Math.round(v/1000)/100:null;
}
function noteBlock(l){
  if(noteId==l.id)return `<div class="form"><textarea id="nt" rows="3" placeholder="Write a note...">${esc(l.remarks||'')}</textarea><div class="acts" style="margin-top:0"><button class="g sm" onclick="saveNote(${l.id})">💾 Save</button><button class="sm" onclick="noteId=null;render()">Cancel</button></div></div>`;
  return (l.remarks?`<div class="note">📝 ${esc(l.remarks)}</div>`:'')+`<div style="margin-top:6px"><button class="sm" onclick="noteId=${l.id};openId=null;openK=null;render()">📝 ${l.remarks?'Edit note':'Add note'}</button></div>`;
}
async function saveNote(id){
  const {error}=await sb.from('leads').update({remarks:$('#nt').value.trim()}).eq('id',id);
  if(error)return toast(error.message,1);noteId=null;toast('Note saved ✅');render();
}

/* ---------- lead card + actions ---------- */
function leadCard(l,cs){
  LEADS[l.id]=l;
  const fe=l.fe_id&&P[l.fe_id]?.name,tc=l.tc_id&&P[l.tc_id]?.name;
  const chips=[l.bhk,l.sqft?l.sqft+' sqft':'',fp(l)].filter(Boolean).map(x=>`<span class="tag">${esc(x)}</span>`).join('');
  const where=[l.property,l.locality].filter(Boolean).map(esc).join(' · ');
  return `<div class="card"><div class="row"><div><b>${esc(l.name||'-')}</b><br><a href="tel:${esc(l.phone)}">${esc(l.phone||'')}</a><a class="wa" href="https://wa.me/91${esc(ph10(l.phone))}" target="_blank" rel="noopener">💬 WhatsApp</a></div>${tag(l.status)}</div>
  ${where?`<div style="margin-top:6px">🏢 ${where}</div>`:''}
  ${chips?`<div class="chp">${chips}</div>`:''}
  ${noteBlock(l)}
  ${cs!==undefined?'<div style="margin:6px 0">'+hist(cs)+'</div>':''}
  ${(fe||tc||l.meeting_date)?'<div class="mu">'+[fe?'Field Exec: '+esc(fe):'',tc?'Telecaller: '+esc(tc):'',l.meeting_date?'Meeting: '+esc(l.meeting_date):''].filter(Boolean).join(' · ')+'</div>':''}
  ${actions(l)}</div>`;
}
function openForm(id,k){openId=id;openK=k;noteId=null;render()}
function closeForm(){openId=null;openK=null;clearInterval(tint);t0=null;render()}
function actions(l){
  if(openId==l.id)return openK=='call'?callForm(l):openK=='status'?statusForm(l):openK=='assign'?assignForm(l):openK=='del'?delForm(l):'';
  const b=[];
  if(ME.role!='fe')b.push(`<button class="p" onclick="openForm(${l.id},'call')">📞 Call</button>`);
  b.push(`<button onclick="openForm(${l.id},'status')">🔄 Status</button>`);
  b.push(`<button onclick="openForm(${l.id},'assign')">👥 Assign</button>`);
  if(ME.role=='admin')b.push(`<button class="r" onclick="openForm(${l.id},'del')">🗑 Delete</button>`);
  return `<div class="acts">${b.join('')}</div>`;
}
const stOpts=()=>'<option value="">— Select status —</option>'+myStatuses().map(s=>`<option value="${s}">${ST[s]}</option>`).join('');
const feOpts=sel=>Object.values(P).filter(p=>p.role=='fe').map(f=>`<option value="${f.id}" ${f.id==sel?'selected':''}>${esc(f.name||f.id)}</option>`).join('');
const meetBox=l=>`<div id="mt" class="f2" style="display:none"><div><label>Field Exec</label><select id="fe">${feOpts(l.fe_id)}</select></div><div><label>Meeting date</label><input id="dt" type="date"></div></div>`;
const onSt=`onchange="const m=$('#mt');if(m)m.style.display=this.value=='meeting_assigned'?'grid':'none'"`;
function statusUpd(l,st){
  const upd={status:st};
  if(st=='meeting_assigned'){
    const fe=$('#fe')&&$('#fe').value,dt=$('#dt')&&$('#dt').value;
    if(!fe||!dt)return {err:'Select a Field Exec and the meeting date'};
    upd.fe_id=fe;upd.meeting_date=dt;
    if(ME.role=='telecaller')upd.tc_id=ME.id;
  }else if(ME.role=='telecaller'&&!l.tc_id)upd.tc_id=ME.id;
  return {upd};
}
function statusForm(l){
  return `<div class="form"><label>Change status</label><select id="sst" ${onSt}>${stOpts()}</select>${ME.role!='fe'?meetBox(l):''}
  <div class="acts" style="margin-top:0"><button class="g" onclick="saveStatus(${l.id})">💾 Save</button><button onclick="closeForm()">Cancel</button></div></div>`;
}
async function saveStatus(id){
  const l=LEADS[id],st=$('#sst').value;
  if(!st)return toast('Select a status',1);
  const u=statusUpd(l,st);if(u.err)return toast(u.err,1);
  const {error}=await sb.from('leads').update(u.upd).eq('id',id);
  if(error)return toast(error.message,1);
  openId=null;openK=null;toast('Status updated ✅');render();
}
function assignForm(l){
  const grp=(r,t)=>{const a=Object.values(P).filter(p=>p.role==r);return a.length?`<optgroup label="${t}">${a.map(p=>`<option value="${p.id}">${esc(p.name||p.id)}</option>`).join('')}</optgroup>`:''};
  return `<div class="form"><label>Assign this lead to</label><select id="asg"><option value="">— Select person —</option>${grp('fe','Field Executives')}${grp('telecaller','Telecallers')}</select>
  <div class="mu">The person you pick gets access to this lead.</div>
  <div class="acts" style="margin-top:0"><button class="g" onclick="saveAssign(${l.id})">✅ Assign</button><button onclick="closeForm()">Cancel</button></div></div>`;
}
async function saveAssign(id){
  const pid=$('#asg').value;if(!pid)return toast('Select a person',1);
  const p=P[pid],upd=p.role=='fe'?{fe_id:pid}:{tc_id:pid};
  const {data,error}=await sb.from('leads').update(upd).eq('id',id).select('id');
  if(error)return toast(error.message,1);
  if(!data||!data.length)return toast('Could not assign this lead',1);
  openId=null;openK=null;toast('Assigned to '+(p.name||'user')+' ✅');render();
}
function delForm(l){
  return `<div class="form"><div class="er">Delete ${esc(l.name||'this lead')}? Its call history will also be deleted. This cannot be undone.</div>
  <div class="acts" style="margin-top:0"><button class="r" onclick="doDelete(${l.id})">Yes, delete</button><button onclick="closeForm()">Cancel</button></div></div>`;
}
async function doDelete(id){
  if(ME.role!='admin')return toast('Only admin can delete',1);
  const {data,error}=await sb.from('leads').delete().eq('id',id).select('id');
  if(error)return toast(error.message,1);
  if(!data||!data.length)return toast('Could not delete',1);
  FILT.t=0;openId=null;openK=null;toast('Lead deleted');render();
}
const empty=m=>`<p class="mu" style="text-align:center;margin:30px 0">${m}</p>`;
const searchBar=ph=>`<div class="card"><div class="f2" style="grid-template-columns:1fr auto"><input id="sq" placeholder="${ph}" value="${esc(q)}" onkeydown="if(event.key=='Enter')doSearch()"><button class="p" onclick="doSearch()">Search</button></div></div>`;
function doSearch(){q=$('#sq').value;openId=null;openK=null;render()}
const getSeen=()=>{try{return JSON.parse(localStorage.getItem('seen_'+ME.id)||'[]')}catch(e){return[]}};
const setSeen=a=>{try{localStorage.setItem('seen_'+ME.id,JSON.stringify(a))}catch(e){}};
async function dealBanner(){
  const {data}=await sb.from('leads').select('id').eq('tc_id',ME.id).eq('status','deal_closed');
  const seen=getSeen(),n=(data||[]).filter(l=>!seen.includes(l.id)).length;
  return n?`<div class="card alert" onclick="go('deal')">🎉 ${n} deal${n>1?'s':''} closed! Tap to view</div>`:'';
}

/* ---------- add lead (all roles) ---------- */
function addLeadCard(){
  if(!showAdd)return `<button style="margin-bottom:10px" onclick="showAdd=true;render()">➕ Add Lead</button>`;
  return `<div class="card"><b>New property owner</b><div class="form" style="border:0;padding-top:4px">
  <input id="an" placeholder="Owner name"><input id="ap" type="tel" placeholder="Mobile number (10 digits)">
  <input id="ar" placeholder="Society / Property name"><input id="al" placeholder="Area / Locality (e.g. Baner)">
  <div class="f2"><input id="ab" placeholder="BHK (e.g. 2 BHK)"><input id="as" type="number" placeholder="Area (sqft)"></div>
  <input id="ac" placeholder="Price (e.g. 85 L or 1.2 Cr)"><textarea id="am" rows="2" placeholder="Notes (optional)"></textarea>
  <div class="acts"><button class="p" onclick="addLead()">Save</button><button onclick="showAdd=false;render()">Cancel</button></div></div></div>`;
}
async function addLead(){
  const phone=ph10($('#ap').value);
  if(phone.length!=10)return toast('Enter a 10-digit mobile number',1);
  const pr=$('#ac').value.trim();
  const row={name:$('#an').value.trim(),phone,property:$('#ar').value.trim(),locality:$('#al').value.trim(),bhk:$('#ab').value.trim(),sqft:parseInt($('#as').value)||null,price:pr,price_l:parsePrice(pr),remarks:$('#am').value.trim()};
  if(ME.role=='fe')row.fe_id=ME.id;
  if(ME.role=='telecaller')row.tc_id=ME.id;
  const {error}=await sb.from('leads').insert(row);
  if(error)return toast(error.message,1);
  FILT.t=0;showAdd=false;toast('Lead added ✅');render();
}
async function loadFilt(){
  if(Date.now()-FILT.t<300000)return;
  const d=await pageAll(()=>sb.from('leads').select('locality,bhk'));
  FILT.loc=[...new Set(d.map(x=>x.locality).filter(Boolean))].sort();
  FILT.bhk=[...new Set(d.map(x=>x.bhk).filter(Boolean))].sort();FILT.t=Date.now();
}
const filterBar=()=>`<div class="f2" style="margin-bottom:8px"><select onchange="fLoc=this.value;render()"><option value="">All areas</option>${FILT.loc.map(x=>`<option ${x==fLoc?'selected':''}>${esc(x)}</option>`).join('')}</select><select onchange="fBhk=this.value;render()"><option value="">All BHK</option>${FILT.bhk.map(x=>`<option ${x==fBhk?'selected':''}>${esc(x)}</option>`).join('')}</select></div>
<select style="margin-bottom:10px" onchange="fSt=this.value;render()"><option value="">All statuses</option>${Object.entries(ST).map(([k,v])=>`<option value="${k}" ${k==fSt?'selected':''}>${v}</option>`).join('')}</select>`;
const applyF=qy=>{if(fLoc)qy=qy.eq('locality',fLoc);if(fBhk)qy=qy.eq('bhk',fBhk);if(fSt)qy=qy.eq('status',fSt);return qy};
const srch=qq=>`name.ilike.%${qq}%,phone.ilike.%${qq}%,property.ilike.%${qq}%,locality.ilike.%${qq}%`;

/* ---------- call timer + call form ---------- */
function startT(){if(t0)return;t0=Date.now();tint=setInterval(()=>{const e=$('#tmr');if(e)e.textContent='Timer: '+fmt((Date.now()-t0)/1000)},1000)}
function stopT(){
  if(!t0)return toast('Tap "Start call" first',1);
  const s=Math.round((Date.now()-t0)/1000);clearInterval(tint);t0=null;
  $('#mi').value=Math.floor(s/60);$('#se').value=s%60;$('#tmr').textContent='Talk time: '+fmt(s);
}
function callForm(l){
  return `<div class="form">
  <div class="f2"><a class="btn p" href="tel:${esc(l.phone)}" onclick="startT()">📞 Start call</a><button onclick="stopT()">⏹ End call</button></div>
  <div id="tmr" class="mu">Tap "Start call" to run a timer, then "End call" to fill the talk time below. You can also type it by hand.</div>
  <div class="f2"><div><label>Talk time: minutes</label><input id="mi" type="number" min="0" value="0"></div><div><label>Talk time: seconds</label><input id="se" type="number" min="0" max="59" value="0"></div></div>
  <label>Call result / status</label><select id="sst" ${onSt}>${stOpts()}</select>${meetBox(l)}
  <textarea id="cn" rows="2" placeholder="Notes (optional)">${esc(l.remarks||'')}</textarea>
  <div class="acts" style="margin-top:0"><button class="g" onclick="saveCall(${l.id})">💾 Save</button><button onclick="closeForm()">Cancel</button></div></div>`;
}
async function saveCall(id){
  const l=LEADS[id],dur=(+$('#mi').value||0)*60+(+$('#se').value||0),st=$('#sst').value;
  if(!st)return toast('Select a call result / status',1);
  const u=statusUpd(l,st);if(u.err)return toast(u.err,1);
  const nt=$('#cn').value.trim();
  if(nt!==(l.remarks||''))u.upd.remarks=nt;
  const {error}=await sb.from('calls').insert({lead_id:id,phone:l.phone,by_id:ME.id,duration_sec:dur,outcome:ST[st]});
  if(error)return toast(error.message,1);
  const {error:e2}=await sb.from('leads').update(u.upd).eq('id',id);
  if(e2)return toast(e2.message,1);
  clearInterval(tint);t0=null;openId=null;openK=null;toast('Saved ✅');render();
}

const lr=(a,b)=>`<div class="lr"><div>${a}</div><div style="text-align:right;white-space:nowrap">${b}</div></div>`;
const sinceISO=()=>{if(RANGE=='all')return null;const d=new Date();if(RANGE=='today')d.setHours(0,0,0,0);else d.setDate(d.getDate()-7);return d.toISOString()};
const rangeChips=()=>`<div class="chips">${[['today','Today'],['7','7 days'],['all','All']].map(r=>`<button class="${RANGE==r[0]?'on':''}" onclick="RANGE='${r[0]}';render()">${r[1]}</button>`).join('')}</div>`;
const callsInRange=()=>{const s=sinceISO();return pageAll(()=>{let x=sb.from('calls').select('*').order('created_at',{ascending:false});if(s)x=x.gte('created_at',s);return x})};
const isMeet=c=>c.outcome=='Meeting Assigned'||c.outcome=='Meeting Fixed';

  const cnt=await Promise.all(Object.keys(ST).map(s=>sb.from('leads').select('*',{count:'exact',head:true}).eq('status',s).then(r=>[s,r.count||0])));
  const C=Object.fromEntries(cnt),total=cnt.reduce((a,c)=>a+c[1],0);
  const talk=calls.reduce((a,c)=>a+(c.duration_sec||0),0);
  const by={};calls.forEach(c=>{const b=by[c.by_id]=by[c.by_id]||{n:0,t:0,m:0};b.n++;b.t+=c.duration_sec||0;if(isMeet(c))b.m++});
  const stat=(a,b)=>`<div class="card stat"><span class="mu">${a}</span><b>${b}</b></div>`;

  <div class="grid">${stat('Total leads',total)}${Object.entries(ST).map(([k,v])=>stat(v,C[k])).join('')}</div>
  <div class="card"><b>📲 Incoming call? Enter the number</b><div class="f2" style="grid-template-columns:1fr auto;margin-top:8px"><input id="ln" type="tel" placeholder="Mobile number" onkeydown="if(event.key=='Enter')lookup()"><button class="p" onclick="lookup()">Look up</button></div><div id="lk"></div></div>
  <div class="card"><b>Telecaller performance</b>${Object.entries(by).map(([id,b])=>lr(`<b>${esc(P[id]?.name||'?')}</b><br><span class="mu">${b.n} calls · ${b.m} meetings</span>`,`${fmt(b.t)}<br><span class="mu">talk time</span>`)).join('')||'<p class="mu">No calls in this period</p>'}</div>`;
};

}

function loadFile(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{$('#imp').value=r.result};r.readAsText(f)}
function splitLine(ln){
  if(ln.includes('\t'))return ln.split('\t').map(s=>s.trim());
  const out=[];let cur='',qt=false;
  for(let i=0;i<ln.length;i++){const ch=ln[i];
    if(ch=='"'){if(qt&&ln[i+1]=='"'){cur+='"';i++}else qt=!qt}
    else if(ch==','&&!qt){out.push(cur.trim());cur=''}
    else cur+=ch}
  out.push(cur.trim());return out;
}
function colKey(h){
  h=String(h||'').toLowerCase();
  if(/mobile|phone|contact/.test(h))return 'phone';
  if(/sq/.test(h))return 'sqft';
  if(/price|rate|amount/.test(h))return 'price';
  if(/bhk|config/.test(h))return 'bhk';
  if(/locality|area|location/.test(h))return 'locality';
  if(/remark|note/.test(h))return 'remarks';
  if(/property|society|project/.test(h))return 'property';
  if(/owner|naam|name/.test(h))return 'name';
  return null;
}
async function doImport(){
  const lines=$('#imp').value.split(/\r?\n/).filter(s=>s.trim());
  if(!lines.length){$('#impr').textContent='Paste some data first.';return}
  let first=splitLine(lines[0]);
  let map=first.map(colKey),body=lines.slice(1);
  if(!map.includes('phone')){ // no header found: old format Name, Mobile, Property, Price
    map=['name','phone','property','price'];body=lines;
  }
  const seen=new Set(),rows=[];let bad=0;
  const ex=await pageAll(()=>sb.from('leads').select('phone,property,bhk'));
  const key=(p,pr,b)=>p+'|'+String(pr||'').toLowerCase().trim()+'|'+String(b||'').toLowerCase().trim();
  ex.forEach(e=>seen.add(key(e.phone,e.property,e.bhk)));
  let dup=0;
  for(const ln of body){
    const c=splitLine(ln),r={};
    map.forEach((k,i)=>{if(k&&!r[k]&&c[i]!=null)r[k]=String(c[i]).replace(/^"|"$/g,'').trim()});
    const phone=ph10(r.phone);
    if(phone.length!=10){bad++;continue}
    let prop=r.property||'';if(/unspecified/i.test(prop))prop='';
    const k=key(phone,prop,r.bhk);
    if(seen.has(k)){dup++;continue}seen.add(k);
    rows.push({name:r.name||'',phone,property:prop,locality:r.locality||'',bhk:r.bhk||'',sqft:parseInt(String(r.sqft||'').replace(/,/g,''))||null,price:r.price||'',price_l:parsePrice(r.price),remarks:r.remarks||''});
  }
  if(!rows.length){$('#impr').textContent=`No new leads found. ${dup} already existed, ${bad} had an invalid number.`;return}
  for(let i=0;i<rows.length;i+=500){
    const {error}=await sb.from('leads').insert(rows.slice(i,i+500));
    if(error){$('#impr').textContent='Error: '+error.message;return}
  }
  FILT.t=0;
  $('#impr').textContent=`${rows.length} new leads added. ${dup} already existed, ${bad} had an invalid number.`;
  toast('Import done ✅');setTimeout(render,1200);
}
