<!DOCTYPE html>
<html lang="hi"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f4e78">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>EasyDeals CRM</title>
<style>
:root{--bg:#f4f6f9;--card:#fff;--tx:#1b1f24;--mu:#6b7280;--bd:#e2e5ea;--pr:#1f4e78;--ok:#15803d;--wr:#b45309;--er:#b91c1c}
*{box-sizing:border-box}
body{margin:0;font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--tx);padding-bottom:70px}
header{position:sticky;top:0;z-index:5;display:flex;gap:8px;align-items:center;justify-content:space-between;padding:10px 14px;background:var(--pr);color:#fff}
header b{font-size:16px}#who{font-size:12px;opacity:.9}
header button{background:rgba(255,255,255,.18);color:#fff;border:0;border-radius:8px;padding:6px 10px;font-size:13px}
main{max-width:900px;margin:auto;padding:12px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0)}
nav button{flex:1;border:0;background:none;padding:10px 4px;font-size:12px;color:var(--mu)}
nav button.on{color:var(--pr);font-weight:700;border-top:3px solid var(--pr)}
input,select,textarea,button,.btn{font:inherit}
input,select,textarea{width:100%;padding:9px 10px;border:1px solid var(--bd);border-radius:8px;background:#fff;color:var(--tx)}
button,.btn{display:inline-block;cursor:pointer;border:1px solid var(--bd);background:#fff;color:var(--tx);border-radius:8px;padding:8px 12px;text-decoration:none;text-align:center}
.p{background:var(--pr);border-color:var(--pr);color:#fff}.g{background:var(--ok);border-color:var(--ok);color:#fff}.r{color:var(--er)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:10px}
.alert{border-color:var(--ok);background:#ecfdf3;cursor:pointer}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-start;justify-content:space-between}
.mu{color:var(--mu);font-size:12.5px}.er{color:var(--er)}.ok{color:var(--ok)}.wr{color:var(--wr)}
.tag{display:inline-block;padding:2px 9px;border-radius:99px;font-size:11.5px;border:1px solid var(--bd);white-space:nowrap}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:10px}
.stat b{display:block;font-size:22px}
.form{margin-top:10px;padding-top:10px;border-top:1px dashed var(--bd);display:grid;gap:8px}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--bd);white-space:nowrap}
.chips{display:flex;gap:6px;margin-bottom:10px}.chips button.on{background:var(--pr);color:#fff;border-color:var(--pr)}
.login{max-width:340px;margin:12vh auto;display:grid;gap:10px;text-align:center}
#toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:10px;display:none;z-index:9;max-width:90%}
#toast.err{background:var(--er)}
#tmr{font-weight:700}
</style></head><body>
<header id="hdr" style="display:none"><div><b>🏠 EasyDeals CRM</b><br><span id="who"></span></div><div><button id="inst" style="display:none" onclick="doInstall()">📲 Install</button> <button onclick="render()">⟳</button> <button onclick="logout()">Logout</button></div></header>
<main id="app"></main>
<nav id="nav" style="display:none"></nav>
<div id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SB_URL='https://sfvpslsexobukgerkixi.supabase.co';
const SB_KEY='sb_publishable_YckWE6w7_PM9Q8ysBM-XFg_KBQwYDEa';
const sb=supabase.createClient(SB_URL,SB_KEY);
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=s=>{s=Math.round(+s||0);const m=Math.floor(s/60),r=s%60;return m?m+' min '+r+' sec':r+' sec'};
const dshort=x=>new Date(x).toLocaleDateString('en-IN',{day:'2-digit',month:'short'});
const dtime=x=>new Date(x).toLocaleString('en-IN',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'});
const ST={new:'Naya',callback:'Callback',not_interested:'Not Interested',meeting_assigned:'Meeting Assigned',fe_followup:'Follow-up',fe_not_interested:'FE Not Interested',deal_closed:'Deal Closed'};
const ROLE={admin:'Admin',telecaller:'Telecaller',fe:'Field Exec'};
const tag=s=>`<span class="tag ${s=='deal_closed'?'ok':/not_int/.test(s)?'er':'wr'}">${ST[s]||esc(s)}</span>`;
let ME=null,P={},tab='',openId=null,q='',RANGE='today',showAdd=false,LEADS={},poll=null,t0=null,tint=null,instEv=null;

function toast(m,err){const t=$('#toast');t.textContent=m;t.className=err?'err':'';t.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display='none',3200)}
const clean=s=>String(s||'').replace(/[,()%*]/g,' ').trim();
const ph10=s=>String(s||'').replace(/\D/g,'').slice(-10);

/* ---------- login ---------- */
function showLogin(msg){
  $('#hdr').style.display='none';$('#nav').style.display='none';
  $('#app').innerHTML=`<div class="login"><h1>🏠 EasyDeals CRM</h1>
  <input id="em" type="email" placeholder="Email" autocomplete="username">
  <input id="pw" type="password" placeholder="Password" autocomplete="current-password" onkeydown="if(event.key=='Enter')login()">
  <button class="p" onclick="login()">Login</button><div class="er" id="lerr">${esc(msg||'')}</div></div>`;
}
async function login(){
  const {data,error}=await sb.auth.signInWithPassword({email:$('#em').value.trim(),password:$('#pw').value});
  if(error){$('#lerr').textContent='Email ya password galat hai.';return}
  boot(data.user);
}
async function logout(){await sb.auth.signOut();ME=null;clearInterval(poll);showLogin()}
async function boot(user){
  const {data:me,error}=await sb.from('profiles').select('*').eq('id',user.id).single();
  if(error||!me){showLogin('Profile nahi mili. Admin se sampark karein.');return}
  ME=me;
  const {data:all}=await sb.from('profiles').select('*');P={};(all||[]).forEach(p=>P[p.id]=p);
  $('#hdr').style.display='flex';$('#nav').style.display='flex';
  tab='';openId=null;q='';
  render();
  clearInterval(poll);
  poll=setInterval(()=>{if(!ME||document.hidden||openId)return;const a=document.activeElement;if(a&&/INPUT|SELECT|TEXTAREA/.test(a.tagName))return;render()},45000);
}

/* ---------- shell ---------- */
const TABS={
  admin:[['dash','📊 Dashboard'],['calls','📞 Call Log'],['leads','🗂 Data'],['team','👥 Team']],
  telecaller:[['call','📞 Calling'],['meet','📅 Meetings'],['deal','✅ Deals']],
  fe:[['asg','📅 Meetings'],['fu','🔁 Follow-up'],['ni','❌ Not Int.'],['deal','✅ Deals']]};
function go(t){tab=t;q='';openId=null;showAdd=false;render()}
async function render(){
  if(!ME)return;
  const list=TABS[ME.role]||TABS.telecaller;
  if(!list.find(t=>t[0]==tab))tab=list[0][0];
  $('#nav').innerHTML=list.map(t=>`<button class="${t[0]==tab?'on':''}" onclick="go('${t[0]}')">${t[1]}</button>`).join('');
  $('#who').textContent=(ME.name||'')+' · '+(ROLE[ME.role]||ME.role);
  let h;
  try{h=await VIEW[ME.role+':'+tab]()}catch(e){h=`<div class="card er">Error: ${esc(e.message||e)}</div>`}
  let nb='';
  if(ME.role=='telecaller'&&tab!='deal'){try{nb=await dealBanner()}catch(e){}}
  $('#app').innerHTML=nb+h;
}
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();instEv=e;$('#inst').style.display='inline-block'});
async function doInstall(){if(!instEv)return;instEv.prompt();await instEv.userChoice;instEv=null;$('#inst').style.display='none'}

/* ---------- helpers ---------- */
async function pageAll(build){let out=[],f=0;for(;;){const {data,error}=await build().range(f,f+999);if(error)throw error;out=out.concat(data);if(data.length<1000||f>20000)break;f+=1000}return out}
async function histMap(ids){
  if(!ids.length)return {};
  const {data}=await sb.from('calls').select('lead_id,by_id,duration_sec,outcome,created_at').in('lead_id',ids).order('created_at',{ascending:false});
  const m={};(data||[]).forEach(c=>(m[c.lead_id]=m[c.lead_id]||[]).push(c));return m;
}
const hist=cs=>cs&&cs.length?'<div class="mu">Call history: '+cs.slice(0,5).map(c=>esc(P[c.by_id]?.name||'?')+' – '+fmt(c.duration_sec)+' ('+dshort(c.created_at)+')').join(' • ')+(cs.length>5?' • +'+(cs.length-5)+' aur':'')+'</div>':'<div class="mu">Is data pe abhi tak koi call nahi</div>';
function leadCard(l,cs,extra){
  LEADS[l.id]=l;
  const fe=l.fe_id&&P[l.fe_id]?.name,tc=l.tc_id&&P[l.tc_id]?.name;
  return `<div class="card"><div class="row"><div><b>${esc(l.name||'-')}</b> · ${esc(l.phone||'')}<br><span class="mu">${esc(l.property||'')}${l.price?' · '+esc(l.price):''}</span></div>${tag(l.status)}</div>
  ${cs!==undefined?'<div style="margin:6px 0">'+hist(cs)+'</div>':''}
  ${(fe||tc||l.meeting_date)?'<div class="mu">'+[fe?'Field Exec: '+esc(fe):'',tc?'Telecaller: '+esc(tc):'',l.meeting_date?'Meeting: '+esc(l.meeting_date):''].filter(Boolean).join(' · ')+'</div>':''}
  ${extra||''}</div>`;
}
const empty=m=>`<p class="mu" style="text-align:center;margin:30px 0">${m}</p>`;
const searchBar=ph=>`<div class="card"><div class="f2" style="grid-template-columns:1fr auto"><input id="sq" placeholder="${ph}" value="${esc(q)}" onkeydown="if(event.key=='Enter')doSearch()"><button class="p" onclick="doSearch()">Dhundhein</button></div></div>`;
function doSearch(){q=$('#sq').value;openId=null;render()}
const getSeen=()=>{try{return JSON.parse(localStorage.getItem('seen_'+ME.id)||'[]')}catch(e){return[]}};
const setSeen=a=>{try{localStorage.setItem('seen_'+ME.id,JSON.stringify(a))}catch(e){}};
async function dealBanner(){
  const {data}=await sb.from('leads').select('id').eq('tc_id',ME.id).eq('status','deal_closed');
  const seen=getSeen(),n=(data||[]).filter(l=>!seen.includes(l.id)).length;
  return n?`<div class="card alert" onclick="go('deal')">🎉 ${n} meeting ki deal close ho gayi! Dekhne ke liye yahan dabayein</div>`:'';
}

/* ---------- add lead ---------- */
function addLeadCard(){
  if(!showAdd)return `<button style="margin-bottom:10px" onclick="showAdd=true;render()">➕ Naya data jodein</button>`;
  return `<div class="card"><b>Naya property owner</b><div class="form" style="border:0;padding-top:4px">
  <input id="an" placeholder="Owner ka naam"><input id="ap" type="tel" placeholder="Mobile number (10 digit)">
  <input id="ar" placeholder="Property (jaise 2BHK, Baner)"><input id="ac" placeholder="Price (jaise 85L)">
  <div class="acts"><button class="p" onclick="addLead()">Save</button><button onclick="showAdd=false;render()">Cancel</button></div></div></div>`;
}
async function addLead(){
  const phone=ph10($('#ap').value);
  if(phone.length!=10)return toast('10 digit ka number daalein',1);
  const {error}=await sb.from('leads').insert({name:$('#an').value.trim(),phone,property:$('#ar').value.trim(),price:$('#ac').value.trim()});
  if(error)return toast(error.code=='23505'?'Ye number pehle se CRM me hai':error.message,1);
  showAdd=false;toast('Data jud gaya ✅');render();
}

/* ---------- call timer + form ---------- */
function startT(){if(t0)return;t0=Date.now();tint=setInterval(()=>{const e=$('#tmr');if(e)e.textContent=fmt((Date.now()-t0)/1000)},1000)}
function stopT(){
  if(!t0)return toast('Pehle "Call shuru" dabayein',1);
  const s=Math.round((Date.now()-t0)/1000);clearInterval(tint);t0=null;
  $('#mi').value=Math.floor(s/60);$('#se').value=s%60;$('#tmr').textContent='Talk time: '+fmt(s);
}
function callForm(l){
  const fes=Object.values(P).filter(p=>p.role=='fe');
  return `<div class="form">
  <div class="f2"><a class="btn p" href="tel:${esc(l.phone)}" onclick="startT()">📞 Call shuru</a><button onclick="stopT()">⏹ Call khatam</button></div>
  <div id="tmr" class="mu">Timer: call shuru karne par chalu hoga, ya talk time neeche haath se daalein</div>
  <div class="f2"><input id="mi" type="number" min="0" placeholder="Minute" value="0"><input id="se" type="number" min="0" max="59" placeholder="Second" value="0"></div>
  <select id="out" onchange="$('#mt').style.display=this.value=='Meeting Fixed'?'grid':'none'">
    <option>Not Picked</option><option>Callback</option><option>Not Interested</option><option>Meeting Fixed</option></select>
  <div id="mt" class="f2" style="display:none"><select id="fe">${fes.map(f=>`<option value="${f.id}">${esc(f.name||f.id)}</option>`).join('')}</select><input id="dt" type="date"></div>
  <div class="acts"><button class="g" onclick="saveCall(${l.id})">💾 Save</button><button onclick="openId=null;render()">Cancel</button></div></div>`;
}
async function saveCall(id){
  const l=LEADS[id],dur=(+$('#mi').value||0)*60+(+$('#se').value||0),out=$('#out').value;
  let upd=null;
  if(out=='Meeting Fixed'){
    const fe=$('#fe').value,dt=$('#dt').value;
    if(!fe||!dt)return toast('Field Exec aur meeting date chuniye',1);
    upd={status:'meeting_assigned',fe_id:fe,tc_id:ME.id,meeting_date:dt};
  }else if(out=='Not Interested')upd={status:'not_interested',tc_id:ME.id};
  else if(out=='Callback')upd={status:'callback'};
  const {error}=await sb.from('calls').insert({lead_id:id,phone:l.phone,by_id:ME.id,duration_sec:dur,outcome:out});
  if(error)return toast(error.message,1);
  if(upd){const {error:e2}=await sb.from('leads').update(upd).eq('id',id);if(e2)return toast(e2.message,1)}
  clearInterval(tint);t0=null;openId=null;toast('Save ho gaya ✅');render();
}
async function setS(id,s){
  const {error}=await sb.from('leads').update({status:s}).eq('id',id);
  if(error)return toast(error.message,1);toast('Update ho gaya ✅');render();
}

/* ---------- views ---------- */
const VIEW={};
// Telecaller
VIEW['telecaller:call']=async()=>{
  let qy=sb.from('leads').select('*').order('created_at',{ascending:true}).limit(50);
  const qq=clean(q);
  if(qq)qy=qy.or(`name.ilike.%${qq}%,phone.ilike.%${qq}%`);else qy=qy.in('status',['new','callback']);
  const {data,error}=await qy;if(error)throw error;
  const hs=await histMap(data.map(l=>l.id));
  const canCall=s=>!['meeting_assigned','fe_followup','deal_closed'].includes(s);
  return searchBar('Naam ya number se dhundhein')+addLeadCard()+
    (data.map(l=>leadCard(l,hs[l.id]||[],canCall(l.status)?(l.id==openId?callForm(l):`<div class="acts"><button class="p" onclick="openId=${l.id};render()">📞 Call / Update</button></div>`):'')).join('')||empty(qq?'Kuch nahi mila.':'Calling ke liye koi data nahi.'));
};
VIEW['telecaller:meet']=async()=>{
  const {data,error}=await sb.from('leads').select('*').eq('tc_id',ME.id).in('status',['meeting_assigned','fe_followup','fe_not_interested']).order('meeting_date',{ascending:false});
  if(error)throw error;
  return data.map(l=>leadCard(l)).join('')||empty('Abhi koi meeting assign nahi hai.');
};
VIEW['telecaller:deal']=async()=>{
  const {data,error}=await sb.from('leads').select('*').eq('tc_id',ME.id).eq('status','deal_closed').order('meeting_date',{ascending:false});
  if(error)throw error;
  setSeen(data.map(l=>l.id));
  return data.map(l=>leadCard(l)).join('')||empty('Abhi koi deal close nahi hui.');
};
// Field Exec
const feList=async(sts,acts)=>{
  const {data,error}=await sb.from('leads').select('*').eq('fe_id',ME.id).in('status',sts).order('meeting_date',{ascending:true});
  if(error)throw error;
  return data.map(l=>leadCard(l,undefined,acts?acts(l):'')).join('')||empty('Kuch nahi hai.');
};
const feBtns=l=>`<div class="acts"><button class="g" onclick="setS(${l.id},'deal_closed')">✅ Deal Closed</button><button onclick="setS(${l.id},'fe_followup')">🔁 Follow-up</button><button class="r" onclick="setS(${l.id},'fe_not_interested')">❌ Not Interested</button></div>`;
VIEW['fe:asg']=()=>feList(['meeting_assigned'],feBtns);
VIEW['fe:fu']=()=>feList(['fe_followup'],feBtns);
VIEW['fe:ni']=()=>feList(['fe_not_interested'],l=>`<div class="acts"><button onclick="setS(${l.id},'fe_followup')">🔁 Wapas Follow-up</button></div>`);
VIEW['fe:deal']=()=>feList(['deal_closed']);
// Admin
const sinceISO=()=>{if(RANGE=='all')return null;const d=new Date();if(RANGE=='today')d.setHours(0,0,0,0);else d.setDate(d.getDate()-7);return d.toISOString()};
const rangeChips=()=>`<div class="chips">${[['today','Aaj'],['7','7 din'],['all','Sab']].map(r=>`<button class="${RANGE==r[0]?'on':''}" onclick="RANGE='${r[0]}';render()">${r[1]}</button>`).join('')}</div>`;
const callsInRange=()=>{const s=sinceISO();return pageAll(()=>{let x=sb.from('calls').select('*').order('created_at',{ascending:false});if(s)x=x.gte('created_at',s);return x})};
VIEW['admin:dash']=async()=>{
  const calls=await callsInRange();
  const cnt=await Promise.all(Object.keys(ST).map(s=>sb.from('leads').select('*',{count:'exact',head:true}).eq('status',s).then(r=>[s,r.count||0])));
  const C=Object.fromEntries(cnt),total=cnt.reduce((a,c)=>a+c[1],0);
  const talk=calls.reduce((a,c)=>a+(c.duration_sec||0),0);
  const by={};calls.forEach(c=>{const b=by[c.by_id]=by[c.by_id]||{n:0,t:0,m:0};b.n++;b.t+=c.duration_sec||0;if(c.outcome=='Meeting Fixed')b.m++});
  const stat=(a,b)=>`<div class="card stat"><span class="mu">${a}</span><b>${b}</b></div>`;
  return rangeChips()+`<div class="grid">${stat('Calls',calls.length)}${stat('Talk time',fmt(talk))}${stat('Meetings fixed',calls.filter(c=>c.outcome=='Meeting Fixed').length)}</div>
  <div class="grid">${stat('Total data',total)}${stat('Naya',C.new)}${stat('Callback',C.callback)}${stat('Meeting Assigned',C.meeting_assigned)}${stat('Follow-up',C.fe_followup)}${stat('Not Interested',C.not_interested+C.fe_not_interested)}${stat('Deals Closed',C.deal_closed)}</div>
  <div class="card"><b>📲 Incoming call? Number daalein</b><div class="f2" style="grid-template-columns:1fr auto;margin-top:8px"><input id="ln" type="tel" placeholder="Mobile number" onkeydown="if(event.key=='Enter')lookup()"><button class="p" onclick="lookup()">Dekhein</button></div><div id="lk"></div></div>
  <div class="card"><b>Telecaller performance</b><div class="tw"><table><tr><th>Naam</th><th>Calls</th><th>Talk time</th><th>Meetings</th></tr>${Object.entries(by).map(([id,b])=>`<tr><td>${esc(P[id]?.name||'?')}</td><td>${b.n}</td><td>${fmt(b.t)}</td><td>${b.m}</td></tr>`).join('')||'<tr><td colspan="4" class="mu">Is period me koi call nahi</td></tr>'}</table></div></div>`;
};
async function lookup(){
  const n=ph10($('#ln').value);if(n.length<10){$('#lk').innerHTML='<p class="er">10 digit number daalein</p>';return}
  const {data}=await sb.from('leads').select('*').eq('phone',n).limit(1);
  const l=data&&data[0];
  if(!l){$('#lk').innerHTML='<p class="er">Ye number CRM data me nahi mila.</p>';return}
  const hs=await histMap([l.id]);
  $('#lk').innerHTML=`<div style="margin-top:10px">✅ Ye call <b>${esc(l.name||'-')}</b> ka hai</div>`+leadCard(l,hs[l.id]||[]).replace('class="card"','class="card" style="margin-top:8px"');
}
VIEW['admin:calls']=async()=>{
  const calls=await callsInRange();
  const qq=ph10(q);
  const list=qq?calls.filter(c=>(c.phone||'').includes(qq)):calls;
  const ids=[...new Set(list.map(c=>c.lead_id))];
  const names={};
  for(let i=0;i<ids.length;i+=200){const {data}=await sb.from('leads').select('id,name').in('id',ids.slice(i,i+200));(data||[]).forEach(x=>names[x.id]=x.name)}
  const byNum={};list.forEach(c=>{const b=byNum[c.phone]=byNum[c.phone]||{n:0,t:0,who:new Set(),name:names[c.lead_id]};b.n++;b.t+=c.duration_sec||0;b.who.add(P[c.by_id]?.name||'?')});
  return rangeChips()+searchBar('Number se filter (jaise 9890011111)')+
  `<div class="card"><b>Number-wise talk time</b><div class="tw"><table><tr><th>Number</th><th>Owner</th><th>Calls</th><th>Total talk</th><th>Kisne baat ki</th></tr>${Object.entries(byNum).sort((a,b)=>b[1].t-a[1].t).slice(0,100).map(([p,b])=>`<tr><td>${esc(p)}</td><td>${esc(b.name||'-')}</td><td>${b.n}</td><td>${fmt(b.t)}</td><td>${esc([...b.who].join(', '))}</td></tr>`).join('')||'<tr><td colspan="5" class="mu">Koi call nahi</td></tr>'}</table></div></div>

function loadFile(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{$('#imp').value=r.result};r.readAsText(f)}
async function doImport(){
  const lines=$('#imp').value.split(/\r?\n/).map(s=>s.trim()).filter(Boolean);
  const seen=new Set(),rows=[];let bad=0;
  for(const ln of lines){
    const c=ln.split(/\t|,/).map(s=>s.trim().replace(/^"|"$/g,''));
    const phone=ph10(c[1]);
    if(phone.length!=10){bad++;continue}
    if(seen.has(phone)){bad++;continue}seen.add(phone);
    rows.push({name:c[0]||'',phone,property:c[2]||'',price:c[3]||''});
  }
  if(!rows.length){$('#impr').textContent='Koi sahi row nahi mili.';return}
  let added=0;
  for(let i=0;i<rows.length;i+=500){
    const {data,error}=await sb.from('leads').upsert(rows.slice(i,i+500),{onConflict:'phone',ignoreDuplicates:true}).select('id');
    if(error){$('#impr').textContent='Error: '+error.message;return}
    added+=data.length;
  }
  $('#impr').textContent=`${added} naye data jude. ${rows.length-added+bad} skip hue (pehle se maujood ya number galat).`;
  toast('Import ho gaya ✅');
}
